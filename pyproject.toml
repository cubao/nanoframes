[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nanoframes"
version = "0.1.0"
description = "SVG-first, browserless, deterministic frame rendering built on ThorVG. Offline hyperframes-style animated compositions for fast AI-agent iteration."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "thorvg-python",
    "pillow",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
nanoframes = "nanoframes.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["nanoframes"]

[tool.pytest.ini_options]
testpaths = ["tests"]