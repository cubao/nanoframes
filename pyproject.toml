[build-system]
# Pinned at the last hatchling that still supports Python 3.8 as a build
# backend while emitting Metadata-Version 2.4: 1.29.0+ requires >=3.10, and
# 1.32.0 emits Metadata-Version 2.5 which current twine rejects.
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "nanoframes"
version = "0.1.6"
description = "SVG-first, browserless, deterministic frame rendering built on ThorVG. Offline hyperframes-style animated compositions for fast AI-agent iteration."
readme = "README.md"
# Floor is 3.9 — set by the engine binding, not us: thorvg-python has used
# `ctypes.Array[...]` subscripts (a 3.9+ feature) since its initial commit, so
# it never imported on 3.8 (1.1.1 and 1.1.3 both verified broken on 3.8).
# 3.9/3.10/3.12 all pass the full suite. Code hygiene: no 3.10+ constructs;
# every annotated module uses `from __future__ import annotations`).
# Ruff linting intentionally stays on a modern target-version.
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
# Latest thorvg-python (>=1.1.3) bundles ThorVG C++ 1.0.4: newer SVG/text
# rasterization and a working LottieAnimation.get_marker() (the lottie import
# path reads markers). 1.1.2/1.1.3 also fixed Python-side accessor/paint API
# bugs of the 1.0.x bindings.
dependencies = [
    "thorvg-python>=1.1.3",
    "pillow",
    "numpy",  # renderer-exact text measurement (ink bbox from raster pixels)
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "fonttools"]  # fonttools: tests inspect the bundled TTF

[project.scripts]
nanoframes = "nanoframes.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["nanoframes"]

# docs/ and skills/ live at the repo root but ship inside the installed
# package, so agents and humans find them next to the code that implements
# them (nanoframes/docs, nanoframes/skills).
[tool.hatch.build.targets.wheel.force-include]
"docs" = "nanoframes/docs"
"skills" = "nanoframes/skills"

[tool.pytest.ini_options]
testpaths = ["tests"]