[build-system]
# Pinned at the last hatchling that still supports Python 3.8 as a build
# backend while emitting Metadata-Version 2.4: 1.29.0+ requires >=3.10, and
# 1.32.0 emits Metadata-Version 2.5 which current twine rejects.
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "nanoframes"
version = "0.1.0"
description = "SVG-first, browserless, deterministic frame rendering built on ThorVG. Offline hyperframes-style animated compositions for fast AI-agent iteration."
readme = "README.md"
# Floor is 3.8 on purpose: users run 3.8, and the whole package is written
# 3.8-safe (every annotated module uses `from __future__ import annotations`,
# so PEP 585/604 annotation syntax is inert; no 3.9+ runtime constructs).
# Ruff linting intentionally stays on a modern target-version.
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
dependencies = [
    "thorvg-python",
    "pillow",
    "numpy",  # renderer-exact text measurement (ink bbox from raster pixels)
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
nanoframes = "nanoframes.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["nanoframes"]

# docs/ and skills/ live at the repo root but ship inside the installed
# package, so agents and humans find them next to the code that implements
# them (nanoframes/docs, nanoframes/skills).
[tool.hatch.build.targets.wheel.force-include]
"docs" = "nanoframes/docs"
"skills" = "nanoframes/skills"

[tool.pytest.ini_options]
testpaths = ["tests"]