name: determinism

# One question, on a second machine: do the same declared inputs produce the
# same frames? `tests/digests.json` is recorded on macOS/ARM (Apple M3); every
# job here re-renders the corpus on Linux/x86-64 and compares. That is the half
# of the claim a checkout cannot answer about itself — see docs/determinism.md,
# which also records what the first run measured.
#
# This is deliberately not the test suite: `make test` (pytest) covers the code
# and runs anywhere in seconds. This job pins one toolchain rather than testing
# a version matrix, because a matrix would answer a different question.

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The ledger's `toolchain` component is a digest over thorvg-python's version,
  # the `libthorvg` that wheel carries, this package's version and this package's
  # own modules. `thorvg-python>=1.1.3` would resolve to a newer rasterizer and
  # turn every entry into `changed — toolchain changed`, so the pin is what makes
  # the comparison mean "another machine, same renderer".
  #
  # The library's bytes are in there because a version is not a build: this
  # platform's wheel links its own libthorvg and its own FreeType, so a
  # mismatch here is reported as `changed — toolchain changed` — the expected
  # platform difference, named — rather than as `changed — fonts changed`, which
  # was never the cause. That also makes `regression` reachable again: two
  # machines agreeing on every declared input *and* on the rasterizer build are
  # exactly the pair whose disagreement that verdict is for.
  THORVG_PYTHON: "1.1.3"
  # Not part of the identity. Pinned to the versions the ledger was recorded
  # under so that a red result names the machine rather than a dependency bump;
  # re-recording the ledger moves these pins with it.
  PILLOW: "11.1.0"
  NUMPY: "2.4.2"
  # Measured cross-platform divergences, each with its reason in
  # docs/determinism.md. A composition not listed here that fails to reproduce
  # fails the job: that is the alarm this workflow exists for. Listed
  # compositions are printed on every run as EXCUSED, so an exemption stays a
  # measurement rather than becoming silence.
  EXCUSED_COMPOSITIONS: "examples/text-measure.nf.svg examples/master-demo.nf.svg"

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the recording toolchain
        run: |
          python -m pip install --no-input --upgrade pip
          python -m pip install --no-input \
            "thorvg-python==${THORVG_PYTHON}" "pillow==${PILLOW}" "numpy==${NUMPY}"
          # --no-deps: the package's own `thorvg-python>=1.1.3` floor must not
          # upgrade the rasterizer past the pin above.
          python -m pip install --no-input --no-deps .

      - name: Preconditions
        run: |
          nanoframes doctor --json | tee doctor.json
          python - <<'PY'
          import importlib.metadata as md
          import json, os, sys

          report = json.load(open("doctor.json"))
          checks = {c["name"]: c for c in report["checks"]}
          failed = {n: c for n, c in checks.items() if not c["ok"]}

          # ffmpeg/ffprobe are reported by doctor but not required here: the
          # digest path never runs them (the corpus has no video source, and a
          # media fingerprint is taken from the file's content).
          required = ("thorvg", "fonts")
          for name in required:
              c = checks.get(name)
              if c is None or not c["ok"]:
                  print(f"FAIL {name}: {c['detail'] if c else 'not reported'}"
                        f" -> {c['fix'] if c else 'nanoframes doctor'}", file=sys.stderr)
                  sys.exit(1)

          want = os.environ["THORVG_PYTHON"]
          got = md.version("thorvg-python")
          if got != want:
              # doctor only enforces the floor; the pin is what the ledger was
              # recorded under, and a newer renderer is a different rasterizer.
              print(f"FAIL thorvg-python {got} installed, the ledger was recorded"
                    f" on {want}", file=sys.stderr)
              sys.exit(1)
          print(f"ok: thorvg-python {got}, "
                f"{checks['fonts']['detail']}"
                + (f"; not required here: {', '.join(sorted(failed))}" if failed else ""))
          PY

      - name: Cross-architecture digest
        run: |
          nanoframes digest --all --check --json --ledger tests/digests.json > digest.json
          python - <<'PY'
          import json, os, sys

          excused_ok = set(os.environ["EXCUSED_COMPOSITIONS"].split())
          report = json.load(open("digest.json"))

          matched, excused, bad = [], [], []
          for name, entry in sorted(report["compositions"].items()):
              status = entry["status"]
              if status == "match":
                  matched.append(name)
              elif status == "absent":
                  bad.append((name, "no digest in the ledger — record it with"
                                    " `nanoframes digest --all --record`"))
              elif name in excused_ok:
                  excused.append((name, entry.get("reasons") or []))
              else:
                  why = "; ".join(entry.get("reasons") or []) or "no reason given"
                  bad.append((name, f"{status}: {why}"))

          print(f"{len(matched)} composition(s) reproduced the macOS/ARM digest"
                f" byte for byte on Linux/x86-64")
          for name, reasons in excused:
              print(f"EXCUSED {name}: {'; '.join(reasons)}"
                    f" — known divergence, measured in docs/determinism.md")

          if bad:
              print("\nFAIL — these did not reproduce the digest recorded on"
                    " macOS/ARM:", file=sys.stderr)
              for name, why in bad:
                  print(f"  {name}: {why}", file=sys.stderr)
              print("\nA `toolchain changed` reason means either that the ledger"
                    " predates this commit's code — re-record it on the recording"
                    " machine with `nanoframes digest --all --record` — or that this"
                    " platform's wheel carries a different libthorvg, which is the"
                    " expected difference between architectures and shows up on every"
                    " composition at once. A `fonts changed` reason would mean a"
                    " composition selected a different face here than on the recording"
                    " machine. Any other reason is a real"
                    " cross-machine divergence — if it is glyph antialiasing on"
                    " another platform, measure it and add the composition to"
                    " EXCUSED_COMPOSITIONS with its reason in docs/determinism.md;"
                    " if it is not, the claim is false for this commit.",
                    file=sys.stderr)
              sys.exit(1)

          print(f"ok: {len(matched)} matched, {len(excused)} excused")
          PY
