<svg xmlns="http://www.w3.org/2000/svg"
     data-width="960" data-height="540" data-fps="30" data-duration="4.0"
     data-composition-id="nested-card">
  <!-- One composition, three placements: the same `badge.nf.svg` runs on three
       different clocks (from its start, at 2x, and looping from its middle). -->
  <rect id="bg" width="960" height="540" fill="#0a0c0b"/>
  <text id="title" x="80" y="130" font-family="Sarasa Mono SC" font-size="56"
        fill="#f4f7ff" data-fade="0.4" data-duration="3.6">Nested compositions</text>
  <image id="badge-a" href="badge.nf.svg" x="120" y="250" width="200" height="200"
         data-start="0.4" data-duration="3.6"/>
  <image id="badge-b" href="badge.nf.svg" x="420" y="270" width="160" height="160"
         data-start="0.9" data-duration="3.1" data-speed="2.0"/>
  <image id="badge-c" href="badge.nf.svg" x="680" y="250" width="200" height="200"
         data-start="1.4" data-duration="2.6" data-anchor="1.0" data-loop="true"/>
  <script type="application/nanoframes+json"><![CDATA[
  {
    "animations": [
      {
        "target": "#title",
        "keyframes": [
          {"t": 0.0, "opacity": 0.0, "transform": {"translate": [0, 24]}},
          {"t": 0.6, "opacity": 1.0, "transform": {"translate": [0, 0]}, "ease": "ease-out"}
        ]
      }
    ]
  }
  ]]></script>
</svg>
