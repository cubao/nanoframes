<svg xmlns="http://www.w3.org/2000/svg"
     data-width="640" data-height="360" data-fps="30" data-duration="3.0"
     data-composition-id="raster-title">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1128"/>
      <stop offset="1" stop-color="#16244a"/>
    </linearGradient>
  </defs>

  <rect id="backdrop" width="640" height="360" fill="url(#bg)"/>

  <!-- External raster text: <text data-raster> nodes are handed to a library
       text_handler (bake_svg / render_frame parameter) at bake time. The demo
       handler maps "hello world" -> 你好世界 and draws a stroke + drop shadow
       with the bundled Sarasa Mono SC, so no ThorVG font is involved.
       data-anchor centers the returned PNG on (x, y) at its natural size. -->
  <text id="raster-title" x="320" y="150" font-size="64" fill="#5ef17c"
        data-raster="fancy" data-anchor="center"
        data-start="0.0" data-duration="3.0">hello world</text>

  <text id="raster-sub" x="320" y="240" font-size="24" fill="#9fb0cc"
        data-raster="fancy" data-anchor="center"
        data-start="0.0" data-duration="3.0">handed to a text_handler, not ThorVG fonts</text>

  <script type="application/nanoframes+json"><![CDATA[
    { "animations": [ ] }
  ]]></script>
</svg>
